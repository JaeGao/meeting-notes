<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting notes</title>
<style>
:root {
  --bg: #f5f4f1; --surface: #ffffff; --sunk: #efede9; --ink: #1c1b19; --sub: #5a5752;
  --line: #dcd9d3; --accent: #1b58b8; --on-accent: #ffffff; --danger: #a32222; --rec: #d92d2d;
  --new-bg: #dfe9fb; --new-ink: #123f86; --tr-bg: #fbecc8; --tr-ink: #6e4300;
  --ok-bg: #d9f0de; --ok-ink: #17512a; --off-bg: #e8e6e1; --off-ink: #55524d;
  --bad-bg: #f9dede; --bad-ink: #861b1b; --mark: #ffe58a; --shadow: 0 10px 34px rgba(0,0,0,.18);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --surface: #1f1e1c; --sunk: #2a2826; --ink: #ecebe8; --sub: #aaa69f;
    --line: #37342f; --accent: #8ab6ff; --on-accent: #0c1b33; --danger: #ff8f8f; --rec: #ff5c5c;
    --new-bg: #1c3050; --new-ink: #b9d3ff; --tr-bg: #45340f; --tr-ink: #f6d58a;
    --ok-bg: #173a22; --ok-ink: #a9e3b6; --off-bg: #302e2b; --off-ink: #b5b1aa;
    --bad-bg: #4a1c1c; --bad-ink: #ffb9b9; --mark: #6b5600; --shadow: 0 10px 34px rgba(0,0,0,.55);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button, select, input, textarea { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* buttons: one height, three weights */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.quiet { border-color: transparent; background: none; }
.btn.quiet:hover { background: var(--sunk); }
.btn.icon { width: 32px; padding: 0; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }
select.sel { height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 8px; max-width: 100%; }

/* top bar */
header.top { flex: none; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
header.top h1 { font-size: 15px; margin: 0; font-weight: 650; flex: 1; white-space: nowrap; }
.rec { display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); display: inline-block; flex: none; }
.dot.live { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.rec .time { font-variant-numeric: tabular-nums; font-weight: 600; }
#recBanner { flex: none; display: none; padding: 8px 16px; background: var(--bad-bg); color: var(--bad-ink); gap: 12px; align-items: center; }
#recBanner span { flex: 1; }

/* two panes; nothing scrolls except the list and the reading area */
main { flex: 1; display: flex; min-height: 0; }
#side { width: var(--side-w, 300px); flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface); min-height: 0; }
.sidehead { flex: none; display: flex; align-items: center; padding: 8px 8px 6px 16px; color: var(--sub); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.sidehead span { flex: 1; }
#list { flex: 1; overflow: auto; min-height: 0; }
#list .empty { padding: 16px; color: var(--sub); }
.row { position: relative; border-top: 1px solid var(--line); }
.row .pick { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 44px 10px 16px; cursor: pointer; }
.row:hover, .row:focus-within { background: var(--sunk); }
.row .opt { position: absolute; right: 8px; top: 6px; width: 28px; height: 28px; opacity: 0; }
.row:hover .opt, .row:focus-within .opt, .row[aria-current="true"] .opt, .row .opt[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .row .opt { opacity: 1; } }
.grip { flex: none; width: 9px; margin: 0 -4px; z-index: 3; cursor: col-resize; position: relative; touch-action: none; }
.grip::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: transparent; }
.grip:hover::after, .grip:focus-visible::after, .grip.on::after { left: 3px; width: 3px; background: var(--accent); }
.grip:focus-visible { outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing video, body.resizing .scroll { pointer-events: none; }
.row[aria-current="true"] { background: var(--sunk); box-shadow: inset 3px 0 0 var(--accent); }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { color: var(--sub); font-size: 12.5px; display: flex; gap: 8px; align-items: center; margin-top: 3px; white-space: nowrap; }
.row .m .w { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; white-space: nowrap; flex: none; }
.chip.new, .chip.running { background: var(--new-bg); color: var(--new-ink); }
.chip.transcript { background: var(--tr-bg); color: var(--tr-ink); }
.chip.notes { background: var(--ok-bg); color: var(--ok-ink); }
.chip.no-audio, .chip.queued { background: var(--off-bg); color: var(--off-ink); }
.chip.missing { background: var(--bad-bg); color: var(--bad-ink); }

#detail { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.placeholder { margin: auto; color: var(--sub); text-align: center; padding: 24px; }
.dhead { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px 0 20px; }
.dhead .back { display: none; }
.dhead h2 { flex: 1; min-width: 0; font-size: 18px; margin: 0; line-height: 32px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dhead h2 button { all: unset; cursor: text; border-radius: 5px; padding: 0 5px; margin-left: -5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.dhead h2 button:hover { background: var(--sunk); }
.dhead h2 input { width: 100%; height: 32px; font-size: 17px; font-weight: 650; padding: 0 8px; border: 1px solid var(--accent); border-radius: 7px; background: var(--surface); }
.dmeta { flex: none; padding: 2px 20px 10px; color: var(--sub); font-size: 13px; display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.dmeta .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
.alerts { flex: none; padding: 0 20px; }
.note { border-radius: 8px; padding: 8px 12px; margin-top: 10px; background: var(--off-bg); color: var(--off-ink); }
.note.bad { background: var(--bad-bg); color: var(--bad-ink); white-space: pre-wrap; max-height: 22vh; overflow: auto; }
.progress { flex: 1 1 160px; min-width: 120px; max-width: 320px; }
.progress .bar { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.progress .bar.unknown i { width: 35%; animation: slide 1.4s infinite ease-in-out; }
@keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
.progress .lbl { font-size: 12px; color: var(--sub); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (prefers-reduced-motion: reduce) { .progress .bar.unknown i, .dot.live { animation: none; } .progress .bar.unknown i { width: 100%; opacity: .4; } }

.dbody { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px 20px 0; }
.dmain { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.dside { flex: none; width: min(var(--video-w, 40%), 70%); min-width: 200px; min-height: 0; }
.dside video { width: 100%; max-height: 100%; background: #000; border-radius: 10px; display: block; }
.dbody.solo { justify-content: center; }
.dbody.solo .dside { width: min(100%, 860px); }
.tabs { flex: none; display: flex; gap: 2px; align-items: center; border-bottom: 1px solid var(--line); }
.tabs button.tab { border: 0; background: none; height: 34px; padding: 0 12px; cursor: pointer; color: var(--sub); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600; }
.tabs button.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .grow { flex: 1; }
.tabs input { height: 28px; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 0 9px; width: 200px; max-width: 45%; }
.scroll { flex: 1; min-height: 0; overflow: auto; padding: 12px 6px 24px 0; }
.hint { color: var(--sub); font-size: 13px; margin: 0 0 8px; }
.ts { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; border: 0; background: var(--sunk); color: var(--accent); border-radius: 4px; padding: 1px 5px; cursor: pointer; }
span.ts { color: var(--sub); cursor: default; }
.para { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.para p { margin: 0; overflow-wrap: anywhere; }
.para .ts { align-self: start; justify-self: start; margin-top: 2px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.spk { all: unset; cursor: pointer; font-weight: 650; font-size: 12.5px; border-radius: 5px; padding: 0 6px; margin: 0 6px 0 -6px; color: var(--spk, var(--ink)); }
.spk:hover, .spk:focus-visible { background: var(--sunk); }
.spkin { height: 24px; width: 160px; font-size: 12.5px; font-weight: 600; padding: 0 6px; border: 1px solid var(--accent); border-radius: 5px; background: var(--surface); margin-right: 6px; }
.who { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 0 0 10px; align-items: center; }
.who .spk { margin: 0; border: 1px solid var(--line); padding: 1px 8px; border-radius: 99px; }
.who .sec { font-weight: 400; color: var(--sub); margin-left: 4px; }
code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--sunk); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
.md h1 { font-size: 18px; margin: 0 0 10px; } .md h2 { font-size: 16px; margin: 20px 0 8px; } .md h3 { font-size: 14px; margin: 14px 0 6px; }
.md p, .md ul, .md ol { margin: 0 0 10px; } .md ul, .md ol { padding-left: 22px; } .md li { margin: 3px 0; }
.md .tw { overflow-x: auto; margin: 0 0 12px; }
.md table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--sunk); }

/* popovers: menus and panels anchored to the button that opened them */
.pop { position: fixed; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); display: flex; flex-direction: column; overflow: hidden; }
.menu { padding: 5px; min-width: 230px; overflow: auto; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 10px; border: 0; background: none; border-radius: 7px; cursor: pointer; text-align: left; white-space: nowrap; }
.menu button:hover, .menu button:focus-visible { background: var(--sunk); outline: none; }
.menu button.danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.panel-h { flex: none; display: flex; align-items: center; padding: 10px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.panel-h h3 { flex: 1; margin: 0; font-size: 15px; }
.panel-b { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px; }
.panel-f { flex: none; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
.panel-f .grow { flex: 1; }
.panel-f label, .radio { display: flex; gap: 6px; align-items: center; }
.radio { height: 30px; }
label.f { display: block; font-weight: 600; margin: 0 0 3px; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: none; }

/* record panel: sources on the left, preview on the right; only the source list scrolls */
#recPanel { width: 820px; height: min(560px, calc(100vh - 16px)); }
.recgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px 1fr; grid-template-rows: minmax(0, 1fr); }
.srcs { overflow: auto; border-right: 1px solid var(--line); padding: 6px; min-height: 0; }
.srcs .lbl { padding: 8px 8px 4px; color: var(--sub); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.src { display: flex; gap: 9px; align-items: center; width: 100%; border: 0; background: none; padding: 6px 8px; border-radius: 8px; cursor: pointer; text-align: left; }
.src:hover { background: var(--sunk); }
.src[aria-pressed="true"] { background: var(--new-bg); color: var(--new-ink); }
.src img, .src .noimg { width: 62px; height: 40px; object-fit: cover; object-position: top left; border-radius: 5px; background: var(--sunk); flex: none; border: 1px solid var(--line); }
.src .tx { min-width: 0; }
.src .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src .d { font-size: 12px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prev { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px; gap: 8px; }
.prev .info { flex: none; color: var(--sub); font-size: 13px; min-height: 40px; }
.prev .frame { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; max-width: 100%; max-height: 100%; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; touch-action: none; user-select: none; line-height: 0; display: inline-flex; }
.stage.drag { cursor: crosshair; }
.stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; }
.stage .selbox { position: absolute; border: 2px solid #ff4d4d; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); display: none; pointer-events: none; }
.center { margin: auto; text-align: center; color: var(--sub); padding: 20px; max-width: 46ch; }
#setPanel { width: 480px; }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 9px; display: none; gap: 12px; align-items: center; max-width: min(92vw, 640px); box-shadow: var(--shadow); z-index: 30; }
#toast button { all: unset; cursor: pointer; font-weight: 700; text-decoration: underline; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 20px; max-width: min(92vw, 440px); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog h3 { margin: 0 0 8px; } dialog .dbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

@media (max-width: 1100px) {
  .dbody { flex-direction: column-reverse; gap: 10px; }
  .dbody .grip { display: none; }
  .dside { width: 100%; height: 26vh; display: flex; justify-content: center; }
  .dside video { width: auto; max-width: 100%; height: 100%; }
  .dbody.solo .dside { height: auto; flex: 1; }
}
@media (max-width: 820px) {
  #side { width: 100%; border-right: 0; }
  main > .grip { display: none; }
  #detail { display: none; }
  body.show-detail #side { display: none; }
  body.show-detail #detail { display: flex; }
  .dhead .back { display: inline-flex; }
  .dhead { padding-left: 12px; } .dmeta, .alerts { padding-left: 16px; padding-right: 16px; } .dbody { padding: 10px 16px 0; }
  .para { grid-template-columns: 1fr; gap: 2px; }
  .recgrid { grid-template-columns: 1fr; grid-template-rows: 40% minmax(0, 1fr); }
  .srcs { border-right: 0; border-bottom: 1px solid var(--line); }
  .btn .wide { display: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-more" viewBox="0 0 16 16"><circle cx="3" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="13" cy="8" r="1"/></symbol>
  <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></symbol>
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="i-pen" viewBox="0 0 16 16"><path d="M11 2.5l2.5 2.5L6 12.5l-3 .5.5-3z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.5 4.5h4l1.5 1.5h7.5v6.5h-13z"/></symbol>
  <symbol id="i-film" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6.5 6v4l3.5-2z"/></symbol>
  <symbol id="i-redo" viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v3h3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5v-2h3v2M4.5 4.5l.5 9h6l.5-9"/></symbol>
  <symbol id="i-doc" viewBox="0 0 16 16"><path d="M4 1.5h5.5L12 4v10.5H4zM6 7h4M6 9.5h4M6 12h2.5"/></symbol>
</svg>
<header class="top">
  <h1>Meeting notes</h1>
  <div class="rec" id="rec"></div>
  <button class="btn" id="openSettings" aria-haspopup="dialog"><svg class="i"><use href="#i-gear"/></svg><span class="wide">Settings</span></button>
</header>
<div id="recBanner" role="alert"><span></span><button class="btn" id="recDismiss">Dismiss</button></div>
<main>
  <nav id="side" aria-label="Recordings">
    <div class="sidehead"><span>Recordings</span><button class="btn quiet icon" id="refresh" title="Look for new recordings" aria-label="Look for new recordings"><svg class="i"><use href="#i-refresh"/></svg></button></div>
    <div id="list"></div>
  </nav>
  <div class="grip" id="gripSide" role="separator" aria-orientation="vertical" aria-label="Resize the recordings list" tabindex="0" title="Drag to resize. Double-click to reset."></div>
  <section id="detail"></section>
</main>
<div id="toast" role="status"><span></span><button hidden></button></div>
<dialog id="confirm"><h3></h3><p></p><div class="dbtns"><button class="btn" value="cancel">Cancel</button><button class="btn danger" value="ok"></button></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const S = { entries: [], settings: null, sel: null, tab: 'notes', search: '', detail: {}, editing: false, lastSig: '', lastHead: '', rec: null, built: true,
  recSrc: null, pick: null, rect: null, recMic: true, recAuto: true, stamp: 0 };
const STATUS = { 'new': 'New', 'transcript': 'Transcript only', 'notes': 'Notes written', 'no-audio': 'No audio track' };
const LANGS = [['auto', 'Auto (English and Mandarin)'], ['zh', 'All in Chinese'], ['en', 'All in English']];
const ACTIVE = ['starting', 'recording', 'stopping'];

async function api(path, body) {
  try {
    const r = await fetch('/api/' + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
    return await r.json();
  } catch (e) { return { ok: false, error: 'The meeting-notes server is not answering. Open the Meeting Notes app again.' }; }
}
let toastTimer;
function toast(msg, action, fn) {
  const t = $('#toast'); $('span', t).textContent = msg;
  const b = $('button', t); b.hidden = !action; b.textContent = action || ''; b.onclick = () => { t.style.display = 'none'; fn && fn(); };
  t.style.display = 'flex'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', action ? 12000 : 6000);
}
function confirmBox(title, text, okLabel) {
  return new Promise(res => {
    const d = $('#confirm'); $('h3', d).textContent = title; $('p', d).textContent = text; $('[value=ok]', d).textContent = okLabel;
    d.onclose = () => res(d.returnValue === 'ok');
    d.querySelectorAll('button').forEach(b => b.onclick = () => d.close(b.value));
    d.returnValue = 'cancel'; d.showModal(); $('[value=cancel]', d).focus();
  });
}
const cur = () => S.entries.find(e => e.id === S.sel);
const busy = e => e.job && (e.job.state === 'running' || e.job.state === 'queued');
const when = iso => { const d = new Date(iso); return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); };

function md(src, canSeek) {

}

  let r;
  if (a === 'transcribe') r = await api('transcribe', { id: e.id, lang: $('#lang').value });
  else if (a === 'notes') {
    if (e.status === 'notes' && !await confirmBox('Rewrite the notes?', 'Claude writes the notes again and replaces the current notes file, including any edits you made to it.', 'Rewrite notes')) return;
    r = await api('notes', { id: e.id });
  }
  else if (a === 'stop') r = await api('stop', { id: e.id });
  else if (a === 'reveal') r = await api('reveal', { id: e.id, what: 'recording' });
  else if (a === 'folder') r = await api('reveal', { id: e.id, what: 'notes' });
  else if (a === 'editnotes') r = await api('open', { id: e.id, what: 'notes' });
  else if (a === 'opentr') r = await api('open', { id: e.id, what: 'transcript' });
  else if (a === 'remove') {
    if (!await confirmBox('Move notes to Trash?', 'The transcript and notes for this meeting go to the Trash. The recording is not touched.', 'Move to Trash')) return;
    r = await api('remove', { id: e.id });
    if (r.ok) { delete S.detail[e.id]; S.lastSig = ''; toast('Notes moved to the Trash.', r.trashed ? 'Undo' : null, async () => { const u = await api('restore', { trashed: r.trashed }); if (!u.ok) toast(u.error); await refresh(); loadDetail(); }); }
  }
  if (r && !r.ok) toast(r.error);
  await refresh();
}

// ---------- settings panel ----------
function openSettings() {
  const s = S.settings; if (!s) return;
  const el = openPop($('#openSettings'), 'setPanel', `<div class="panel-h"><h3>Settings</h3><button class="btn quiet icon" id="sX" aria-label="Close">${icon('x')}</button></div>
    <div class="panel-b">
      <label class="f" for="vocab">Names and terms to spell correctly</label>
      <p class="hint">One per line, about 40 at most. Used from the next transcription.</p>
      <textarea id="vocab" rows="8" spellcheck="false">${esc(s.vocabulary)}</textarea>
      <label class="f" for="folders" style="margin-top:12px">Extra folders to look in for recordings</label>
      <p class="hint">One path per line. Always included: ${s.defaultFolders.map(f => `<code>${esc(f)}</code>`).join(' and ')}.</p>
      <textarea id="folders" rows="3" spellcheck="false">${esc(s.folders)}</textarea>
      <p class="hint" style="margin-top:10px">Transcripts and notes are saved in <code>${esc(s.meetingsDir)}</code>.</p>
    </div>
    <div class="panel-f"><span class="grow"></span><button class="btn" id="sCancel">Cancel</button><button class="btn primary" id="sSave">Save</button></div>`, { label: 'Settings' });
  if (!el) return;
  history.replaceState(null, '', '#settings');
  $('#sX', el).onclick = $('#sCancel', el).onclick = () => closePop();
  $('#sSave', el).onclick = async () => {
    const r = await api('settings', { vocabulary: $('#vocab', el).value, folders: $('#folders', el).value });
    if (!r.ok) return toast(r.error);
    closePop(); toast('Settings saved.'); refresh();
  };
  $('#vocab', el).focus();
}

// ---------- record panel ----------
function renderRec(rec, built) {
  const el = $('#rec'), banner = $('#recBanner'), active = rec && ACTIVE.includes(rec.state);
  const sig = JSON.stringify([rec && rec.state, rec && rec.mic, built]);
  if (active && el.dataset.sig === sig) { const t = $('.time', el); if (t) t.textContent = hms(rec.elapsed); }
  else if (el.dataset.sig !== sig) {
    el.dataset.sig = sig;
    if (active) {
      if (pop && pop.id === 'recPanel') closePop(false);
      const label = rec.state === 'starting' ? 'Starting…' : rec.state === 'stopping' ? 'Saving…' : 'Recording';
      el.innerHTML = `<span class="dot live"></span><span>${label}${rec.state === 'recording' && rec.mic === false ? ' (no microphone)' : ''}</span><span class="time">${hms(rec.elapsed)}</span><button class="btn" id="recStop" ${rec.state === 'recording' ? '' : 'disabled'}>Stop</button>`;
      $('#recStop').onclick = async () => { const r = await api('record/stop', {}); if (!r.ok) toast(r.error); refresh(); };
    } else {
      el.innerHTML = `<button class="btn" id="recOpen" aria-haspopup="dialog" aria-expanded="false"><span class="dot"></span>Record</button>`;
      $('#recOpen').onclick = openRecord;
    }
  }
  const failed = rec && rec.state === 'error';
  banner.style.display = failed ? 'flex' : 'none';
  if (failed) $('span', banner).textContent = rec.error || 'The recording failed.';
}
$('#recDismiss').onclick = async () => { await api('record/dismiss', {}); refresh(); };

function openRecord() {
  const el = openPop($('#recOpen'), 'recPanel', `<div class="panel-h"><h3>New recording</h3><button class="btn quiet icon" id="rRefresh" title="Refresh the pictures" aria-label="Refresh the pictures">${icon('refresh')}</button><button class="btn quiet icon" id="rX" aria-label="Close">${icon('x')}</button></div>
    <div class="recgrid" id="recGrid"></div>
    <div class="panel-f"><label><input type="checkbox" id="rMic" ${S.recMic ? 'checked' : ''}> Record my microphone</label><label><input type="checkbox" id="rAuto" ${S.recAuto ? 'checked' : ''}> Transcribe when I stop</label><span class="grow"></span><button class="btn" id="rCancel">Cancel</button><button class="btn primary" id="rGo" disabled><span class="dot" style="background:currentColor"></span>Start recording</button></div>`, { label: 'New recording' });
  if (!el) return;
  history.replaceState(null, '', '#record');
  $('#rX', el).onclick = $('#rCancel', el).onclick = () => closePop();
  $('#rRefresh', el).onclick = loadSources;
  $('#rMic', el).onchange = ev => S.recMic = ev.target.checked;
  $('#rAuto', el).onchange = ev => S.recAuto = ev.target.checked;
  $('#rGo', el).onclick = async () => {
    const r = await api('record/start', { source: S.pick, rect: S.pick.kind === 'display' ? S.rect : null, mic: S.recMic, auto: S.recAuto });
    if (!r.ok) return toast(r.error);
    closePop(false); refresh();
  };
  loadSources();
}
async function loadSources() {
  S.recSrc = { loading: true }; renderSources();
  const r = await api('record/sources', {});
  S.recSrc = r.ok ? r : { error: r.error }; S.stamp = Date.now();
  if (r.ok) {
    const still = S.pick && (S.pick.kind === 'display' ? r.displays : r.windows).some(x => x.id === S.pick.id);
    if (!still) { const d = r.displays.find(x => x.main) || r.displays[0]; S.pick = d ? { kind: 'display', id: d.id } : null; S.rect = null; }
  }
  renderSources();
}
const thumb = x => x.thumb ? `<img src="/preview/${x.thumb}?${S.stamp}" alt="">` : `<div class="noimg"></div>`;
function renderSources() {
  const grid = $('#recGrid'); if (!grid) return;
  const src = S.recSrc || { loading: true }, go = $('#rGo');
  if (src.loading) { grid.innerHTML = `<div class="center" style="grid-column:1/-1">Getting a picture of each screen and window…</div>`; go.disabled = true; return; }
  if (src.error) { grid.innerHTML = `<div class="center" style="grid-column:1/-1"><div class="note bad" style="margin-bottom:12px">${esc(src.error)}</div><button class="btn" id="rAgain">Try again</button></div>`; $('#rAgain').onclick = loadSources; go.disabled = true; return; }
  const on = (k, id) => S.pick && S.pick.kind === k && S.pick.id === id;
  let h = `<div class="srcs" id="srcs"><div class="lbl">Screens</div>` + src.displays.map(d => `<button class="src" data-kind="display" data-id="${d.id}" aria-pressed="${on('display', d.id)}">${thumb(d)}<span class="tx"><div class="n">${d.main ? 'Main screen' : 'Screen ' + d.number}</div><div class="d">${d.width} × ${d.height}</div></span></button>`).join('');
  h += `<div class="lbl">Windows</div>` + (src.windows.length ? src.windows.map(w => `<button class="src" data-kind="window" data-id="${w.id}" aria-pressed="${on('window', w.id)}" title="${esc(w.title)}">${thumb(w)}<span class="tx"><div class="n">${esc(w.app)}</div><div class="d">${esc(w.title)}</div></span></button>`).join('') : `<p class="hint" style="padding:0 8px">No open windows found.</p>`);
  const d = S.pick && S.pick.kind === 'display' && src.displays.find(x => x.id === S.pick.id);
  const w = S.pick && S.pick.kind === 'window' && src.windows.find(x => x.id === S.pick.id);
  const x = d || w;
  h += `</div><div class="prev"><div class="info" id="areaInfo"></div><div class="frame">${x && x.thumb ? `<div class="stage ${d ? 'drag' : ''}" id="stage"><img src="/preview/${x.thumb}?${S.stamp}" alt="Picture of what will be recorded"><div class="selbox" id="selbox"></div></div>` : '<div class="center">No picture available.</div>'}</div>${d ? `<div><button class="btn" id="rWhole">Whole screen</button></div>` : ''}</div>`;
  const keep = $('#srcs') ? $('#srcs').scrollTop : 0;
  grid.innerHTML = h; $('#srcs').scrollTop = keep; go.disabled = !S.pick;
  grid.querySelectorAll('.src').forEach(c => c.onclick = () => { S.pick = { kind: c.dataset.kind, id: Number(c.dataset.id) }; S.rect = null; renderSources(); });
  const whole = $('#rWhole'); if (whole) whole.onclick = () => { S.rect = null; paintArea(); };
  if (d) wireStage();
  paintArea();
}
function paintArea() {
  const info = $('#areaInfo'); if (!info || !S.pick || !S.recSrc.displays) return;
  const box = $('#selbox'), whole = $('#rWhole'), r = S.rect;
  if (S.pick.kind === 'window') { const w = S.recSrc.windows.find(x => x.id === S.pick.id); info.textContent = w ? `Records the part of the screen where this ${w.app} window is now, with all of the Mac's sound. Keep it in place and in front.` : ''; return; }
  const d = S.recSrc.displays.find(x => x.id === S.pick.id); if (!d) return;
  if (box) { box.style.display = r ? 'block' : 'none'; if (r) Object.assign(box.style, { left: r.x * 100 + '%', top: r.y * 100 + '%', width: r.w * 100 + '%', height: r.h * 100 + '%' }); }
  if (whole) whole.disabled = !r;
  info.textContent = r ? `Recording only the marked area, about ${Math.round(r.w * d.width)} × ${Math.round(r.h * d.height)}. Drag again to change it.` : 'Recording the whole screen. Drag on the picture to record only part of it.';
}
function wireStage() {
  const st = $('#stage'); if (!st) return; let from = null;
  const at = ev => { const b = st.getBoundingClientRect(); return { x: Math.min(1, Math.max(0, (ev.clientX - b.left) / b.width)), y: Math.min(1, Math.max(0, (ev.clientY - b.top) / b.height)) }; };
  st.onpointerdown = ev => { from = at(ev); st.setPointerCapture(ev.pointerId); S.rect = { x: from.x, y: from.y, w: 0, h: 0 }; };
  st.onpointermove = ev => { if (!from) return; const p = at(ev); S.rect = { x: Math.min(from.x, p.x), y: Math.min(from.y, p.y), w: Math.abs(p.x - from.x), h: Math.abs(p.y - from.y) }; paintArea(); };
  st.onpointerup = st.onpointercancel = () => { if (!from) return; from = null; if (S.rect && (S.rect.w < 0.05 || S.rect.h < 0.05)) { S.rect = null; toast('That area is too small. Drag a bigger one, or keep the whole screen.'); } paintArea(); };
}

// ---------- resizable panes ----------
// dir: +1 when dragging right makes the pane wider (the list), -1 when it makes it narrower (the video)
function wireGrip(grip, key, dir, min, max, current) {
  const store = 'meeting-notes.' + key, cssVar = '--' + key;
  const set = (w, save = true) => { w = Math.round(Math.min(max(), Math.max(min, w))); document.documentElement.style.setProperty(cssVar, w + 'px'); if (save) { try { localStorage.setItem(store, w); } catch (e) {} } placePop(); };
  try { const saved = Number(localStorage.getItem(store)); if (saved) set(saved, false); } catch (e) {}
  let start = null;
  grip.onpointerdown = ev => { start = { x: ev.clientX, w: current() }; grip.setPointerCapture(ev.pointerId); grip.classList.add('on'); document.body.classList.add('resizing'); ev.preventDefault(); };
  grip.onpointermove = ev => { if (start) set(start.w + dir * (ev.clientX - start.x)); };
  grip.onpointerup = grip.onpointercancel = () => { start = null; grip.classList.remove('on'); document.body.classList.remove('resizing'); };
  grip.ondblclick = () => { document.documentElement.style.removeProperty(cssVar); try { localStorage.removeItem(store); } catch (e) {} };
  grip.onkeydown = ev => { const step = ev.key === 'ArrowRight' ? 1 : ev.key === 'ArrowLeft' ? -1 : 0; if (step) { ev.preventDefault(); set(current() + dir * step * 24); } };
}
wireGrip($('#gripSide'), 'side-w', 1, 220, () => Math.min(640, innerWidth * 0.5), () => $('#side').offsetWidth);

// ---------- refresh loop ----------
let timer;
async function refresh() {
  const r = await api('state');
  if (!r.ok) { toast(r.error); return; }
  const before = cur(), wasBusy = before && busy(before), oldStatus = before && before.status, oldFolder = before && before.folder;
  S.entries = r.entries; S.settings = r.settings; S.rec = r.recording; S.built = r.recorderBuilt;
  renderRec(r.recording, r.recorderBuilt); renderList();
  const now = cur();
  if (now && (now.status !== oldStatus || now.folder !== oldFolder || (wasBusy && !busy(now)))) { delete S.detail[now.id]; loadDetail(); }
  renderDetail();
  clearTimeout(timer);
  timer = setTimeout(refresh, S.rec && ACTIVE.includes(S.rec.state) ? 1000 : S.entries.some(busy) ? 1500 : 15000);
}
$('#refresh').onclick = refresh;
$('#openSettings').onclick = openSettings;
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape' || $('#confirm').open || S.editing) return;
  if (pop) return closePop();
  if (document.activeElement && document.activeElement.id === 'search' && S.search) { S.search = ''; renderDetail(); return; }
  if (S.sel) closeDetail();
});
refresh().then(() => {
  const h = location.hash.slice(1), [id, panel] = h.split('+');
  if (S.entries.some(e => e.id === id)) select(id);
  if (panel === 'transcript') { S.tab = 'transcript'; renderDetail(); }
  if (h === 'settings' || panel === 'settings') openSettings();
  else if ((h === 'record' || panel === 'record') && $('#recOpen')) openRecord();
  else if (panel === 'more' && $('#more')) openMore(cur());
  else if (panel === 'rowmenu') { const b = $('.row[aria-current="true"] .opt'); if (b) b.click(); }
});
</script>
